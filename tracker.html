<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Webカメラ 顔・全身・両手トラッカー</title>
<style>
:root{--bg:#10131a;--fg:#e6e9ef;--mut:#8b93a5;--ok:#3ddc97;--ng:#ff5c6c;--wa:#ffc247;--ac:#4da3ff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
header{position:sticky;top:0;z-index:20;background:#171b25;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-bottom:1px solid #2a3040}
button,select{background:#242b3b;color:var(--fg);border:1px solid #38425a;border-radius:6px;padding:7px 10px;font:inherit}
button.on{background:var(--ac);color:#04101f;border-color:var(--ac)}
label{color:var(--mut);display:inline-flex;gap:4px;align-items:center}
#chips{padding:6px 8px;display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 8px;border-radius:99px;background:#222838;font-size:12px}
.chip[data-s=ok]{color:var(--ok)}.chip[data-s=ng]{color:var(--ng)}.chip[data-s=wa]{color:var(--wa)}
#err{display:none;margin:6px 8px;padding:8px;border:1px solid var(--ng);border-radius:6px;color:#ffb3bb;white-space:pre-wrap;word-break:break-all;font-size:12px}
.stage{position:relative;width:100%;max-width:960px;margin:6px auto;aspect-ratio:4/3;background:#000;overflow:hidden}
video,canvas{position:absolute;inset:0;width:100%;height:100%}
video{object-fit:fill}
#panel{position:fixed;top:56px;right:8px;width:min(310px,60vw);max-height:calc(100vh - 70px);overflow:auto;background:rgba(10,13,20,.88);border:1px solid #333c52;border-radius:8px;padding:8px;z-index:15;font:11px/1.35 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
#panel h4{margin:8px 0 2px;color:var(--ac);font-size:12px}
#note{max-width:960px;margin:6px auto;padding:0 8px;color:var(--mut);font-size:12px;line-height:1.5}
</style></head><body>
<header>
<button id="bCam">カメラをオンにする</button>
<button id="bFace">前面/背面: 前面</button>
<button id="bMode">モード: 2D</button>
<button id="bPanel" class="on">座標パネル</button>
<button id="bCopy">JSONコピー</button>
<label>解像度<select id="sRes"><option value="320">320</option><option value="640" selected>640</option><option value="1280">1280</option></select></label>
<label>検出FPS<select id="sFps"><option>10</option><option selected>20</option><option>30</option><option value="60">最大</option></select></label>
<label>平滑化<select id="sSm"><option value="4">弱</option><option value="1.5" selected>中</option><option value="0.7">強</option></select></label>
<label><input type="checkbox" id="cFace" checked>顔</label>
<label><input type="checkbox" id="cPose" checked>体</label>
<label><input type="checkbox" id="cHand" checked>手</label>
</header>
<div id="chips"></div>
<div id="err"></div>
<div class="stage" id="stage"><video id="v" playsinline muted autoplay></video><canvas id="c"></canvas></div>
<div id="panel"></div>
<div id="note">【座標系】2D: 表示領域のCSSピクセル、原点=映像左上、X右・Y下(前面カメラは鏡像表示と一致)。3D: メートル(推定値・実測距離ではない)、原点=腰中央、X=画面の右、Y=上、Z=手前(カメラ側)。手の3Dは手首を体の手首位置に合わせて配置(体が未検出なら手首原点)。角度は度。顔: yaw正=顔が画面右を向く、pitch正=上向き、roll正=画面上で時計回り。体yaw正=画面右側の肩が手前。※角度の符号は実機で確認してください。左右(Left/Right)は被写体本人の左右手。</div>

<script type="module">
const $=id=>document.getElementById(id);
const video=$('v'),cv=$('c'),ctx=cv.getContext('2d'),stage=$('stage'),panel=$('panel');
const errBox=$('err');
function showErr(t,d){errBox.style.display='block';errBox.textContent='['+t+'] '+d}
addEventListener('error',e=>showErr('JSエラー',e.message));
addEventListener('unhandledrejection',e=>showErr('未処理の例外',String(e.reason&&(e.reason.name+': '+e.reason.message)||e.reason)));

// ---- 状態表示 ----
const chips={cam:['カメラ','待機中','wa'],lib:['ライブラリ','未読込','wa'],face:['顔モデル','未読込','wa'],pose:['体モデル','未読込','wa'],hand:['手モデル','未読込','wa'],fps:['FPS','-','wa']};
function chip(k,txt,s){chips[k][1]=txt;chips[k][2]=s;$('chips').innerHTML=Object.values(chips).map(c=>`<span class="chip" data-s="${c[2]}">${c[0]}: ${c[1]}</span>`).join('')}
chip('cam','待機中','wa');

// ---- 設定 ----
let mode='2d',mirror=true,facing='user',camW=640,fps=20,mc=1.5,showPanel=true;
const B=8; // One Euro beta
const opt={face:true,pose:true,hand:true};
let M=null,FS=null,LM={face:null,pose:null,hand:null};

// ---- 平滑化 (One Euro Filter) ----
const al=(dt,c)=>{const r=6.2832*c*dt;return r/(r+1)};
class OE{constructor(){this.x=null;this.dx=0;this.t=0}
 f(x,t){if(this.x===null){this.x=x;this.t=t;return x}
  const dt=Math.max((t-this.t)/1000,1e-3);this.dx+=al(dt,1)*((x-this.x)/dt-this.dx);
  this.x+=al(dt,mc+B*Math.abs(this.dx))*(x-this.x);this.t=t;return this.x}}
let FL={};
const sm=(k,a,t)=>{const f=FL[k]||(FL[k]=[new OE,new OE,new OE]);return a.map((v,i)=>f[i].f(v,t))};
const drop=p=>{for(const k in FL)if(k.startsWith(p))delete FL[k]};

// ---- 名称 ----
const POSE=['nose','l_eye_in','l_eye','l_eye_out','r_eye_in','r_eye','r_eye_out','l_ear','r_ear','mouth_l','mouth_r','l_shoulder','r_shoulder','l_elbow','r_elbow','l_wrist','r_wrist','l_pinky','r_pinky','l_index','r_index','l_thumb','r_thumb','l_hip','r_hip','l_knee','r_knee','l_ankle','r_ankle','l_heel','r_heel','l_foot_index','r_foot_index'];
const HAND=['wrist'].concat(['thumb','index','middle','ring','pinky'].flatMap(f=>(f==='thumb'?['cmc','mcp','ip','tip']:['mcp','pip','dip','tip']).map(j=>f+'_'+j)));
const FACE_REF={nose_tip:1,chin:152,r_eye_outer:33,l_eye_outer:263,mouth_center:13};

// ---- ライブラリ/モデル読込（カメラとは独立） ----
const CDNS=[['jsDelivr','https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14'],['unpkg','https://unpkg.com/@mediapipe/tasks-vision@0.10.14']];
const MB='https://storage.googleapis.com/mediapipe-models/';
const MODELS={face:MB+'face_landmarker/face_landmarker/float16/1/face_landmarker.task',pose:MB+'pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',hand:MB+'hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'};
async function make(kind){let last;
 for(const d of ['GPU','CPU']){try{
  const baseOptions={modelAssetPath:MODELS[kind],delegate:d},o={baseOptions,runningMode:'VIDEO'};
  if(kind==='face')return await M.FaceLandmarker.createFromOptions(FS,{...o,numFaces:1,outputFacialTransformationMatrixes:true});
  if(kind==='pose')return await M.PoseLandmarker.createFromOptions(FS,{...o,numPoses:1});
  return await M.HandLandmarker.createFromOptions(FS,{...o,numHands:2});
 }catch(e){last=e}}
 throw last}
async function loadAll(){
 const errs=[];
 for(const [n,b] of CDNS){
  try{chip('lib','読込中('+n+')','wa');M=await import(b+'/vision_bundle.mjs');FS=await M.FilesetResolver.forVisionTasks(b+'/wasm');chip('lib','OK('+n+' 0.10.14)','ok');break}
  catch(e){M=null;errs.push(n+': '+(e.name||'')+' '+e.message)}}
 if(!M){chip('lib','失敗','ng');showErr('ライブラリ読込失敗(カメラは使えます)',errs.join('\n'));for(const k of ['face','pose','hand'])chip(k,'未読込','ng');return}
 await Promise.all(['face','pose','hand'].map(async k=>{
  chip(k,'読込中','wa');
  try{LM[k]=await make(k);chip(k,'OK','ok')}
  catch(e){chip(k,'失敗','ng');showErr(k+'モデル読込失敗',e.name+': '+e.message+'\n'+MODELS[k])}}));
}

// ---- カメラ ----
let stream=null,raf=0;
async function camOn(){
 if(stream)return;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){chip('cam','失敗','ng');showErr('カメラ非対応',(isSecureContext?'':'HTTPSではありません。')+'getUserMediaが利用できません');return}
 chip('cam','許可待ち','wa');errBox.style.display='none';
 try{
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:camW},height:{ideal:Math.round(camW*3/4)}}});
  chip('cam','起動中','wa');
  video.srcObject=stream;await video.play();
  const st=stream.getVideoTracks()[0].getSettings();
  mirror=(st.facingMode?st.facingMode==='user':facing==='user');
  video.style.transform=mirror?'scaleX(-1)':'none';
  stage.style.aspectRatio=video.videoWidth+'/'+video.videoHeight;
  chip('cam','起動成功 '+video.videoWidth+'x'+video.videoHeight+(mirror?' (鏡像)':''),'ok');
  $('bCam').textContent='カメラをオフにする';$('bCam').classList.add('on');
  resize();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
 }catch(e){
  stopStream();chip('cam','失敗','ng');
  showErr('カメラ起動失敗',(e.name||'Error')+': '+(e.message||'')+'\n(NotAllowedError=許可拒否 / NotFoundError=カメラなし / NotReadableError=他アプリが使用中 / OverconstrainedError=条件不一致)');
 }}
function stopStream(){cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null}
function camOff(){stopStream();S=empty();FL={};ctx.clearRect(0,0,cv.width,cv.height);chip('cam','停止','wa');chip('fps','-','wa');$('bCam').textContent='カメラをオンにする';$('bCam').classList.remove('on');render(build())}
const restart=async()=>{if(stream){stopStream();await camOn()}};

// ---- 検出 ----
const empty=()=>({pose:null,hands:{},face:null,faceRaw:null});
let S=empty(),lastRun=0,lastT=-1,lastTs=0,cnt=0,cntT=0,lastPanel=0,W=1,H=1;
const inF=p=>p.x>=0&&p.x<=1&&p.y>=0&&p.y<=1;
const t3=w=>[mirror?-w.x:w.x,-w.y,-w.z];
const deg=r=>r*180/Math.PI;
function detect(now){
 let ts=performance.now();if(ts<=lastTs)ts=lastTs+1;lastTs=ts;
 const s=empty();
 if(opt.pose&&LM.pose){try{
  const r=LM.pose.detectForVideo(video,ts);
  if(r.landmarks[0])s.pose={n:r.landmarks[0].map((p,i)=>sm('pn'+i,[p.x,p.y,p.z],now)),w:r.worldLandmarks[0].map((p,i)=>sm('pw'+i,t3(p),now)),v:r.landmarks[0].map(p=>(p.visibility===undefined||p.visibility>=0.5)&&inF(p))};
 }catch(e){showErr('体検出',e.message)}}
 if(!s.pose)drop('pn'),drop('pw');
 if(opt.hand&&LM.hand){try{
  const r=LM.hand.detectForVideo(video,ts),hs=r.handedness||r.handednesses||[],best={};
  r.landmarks.forEach((lm,i)=>{const c=hs[i]&&hs[i][0];if(!c)return;
   const lab=c.categoryName==='Left'?'Right':'Left'; // 非鏡像入力のためラベルを反転して本人の左右にする
   if(best[lab]&&best[lab].sc>=c.score)return;
   const wl=r.worldLandmarks[i].map(t3),base=s.pose&&s.pose.v[lab==='Left'?15:16]?s.pose.w[lab==='Left'?15:16]:null,w0=wl[0],o=base||[0,0,0];
   best[lab]={sc:c.score,v:lm.map(inF),n:lm.map((p,j)=>sm('h'+lab+'n'+j,[p.x,p.y,p.z],now)),w:wl.map((q,j)=>sm('h'+lab+'w'+j,[o[0]+q[0]-w0[0],o[1]+q[1]-w0[1],o[2]+q[2]-w0[2]],now))}});
  s.hands=best;
 }catch(e){showErr('手検出',e.message)}}
 for(const l of ['Left','Right'])if(!s.hands[l])drop('h'+l);
 if(opt.face&&LM.face){try{
  const r=LM.face.detectForVideo(video,ts);
  if(r.faceLandmarks[0]){s.faceRaw=r.faceLandmarks[0];s.face={n:{},v:{}};
   for(const k in FACE_REF){const p=r.faceLandmarks[0][FACE_REF[k]];s.face.n[k]=sm('f'+k,[p.x,p.y,p.z],now);s.face.v[k]=inF(p)}
   const m=r.facialTransformationMatrixes&&r.facialTransformationMatrixes[0];
   if(m){const d=m.data;let yaw=deg(Math.asin(Math.max(-1,Math.min(1,-d[2])))),pit=-deg(Math.atan2(d[6],d[10])),rol=deg(Math.atan2(d[1],d[0]));
    if(mirror){yaw=-yaw;rol=-rol}
    s.face.ang=sm('fa',[yaw,pit,rol],now)}}
  else drop('f');
 }catch(e){showErr('顔検出',e.message)}}
 S=s;cnt++;
}

// ---- 出力データ生成 ----
const f1=v=>+v.toFixed(1),f4=v=>+v.toFixed(4);
function build(){
 const m=mode,o={mode:m,mirror,canvas:[f1(W),f1(H)],units:m==='2d'?'px':'m(推定)',pose:{},hands:{Left:{},Right:{}},face:{},body:{}};
 const P2=n=>[f1((mirror?1-n[0]:n[0])*W),f1(n[1]*H)],P3=w=>w.map(f4),F=m==='2d'?P2:P3,NA=m==='2d'?[null,null]:[null,null,null];
 const p=S.pose,pa=p?(m==='2d'?p.n:p.w):null,ok=i=>!!(p&&p.v[i]);
 const mid=(i,j)=>ok(i)&&ok(j)?F(pa[i].map((v,k)=>(v+pa[j][k])/2)):NA;
 POSE.forEach((nm,i)=>o.pose[nm]=ok(i)?F(pa[i]):NA);
 o.body.hip_center=mid(23,24);o.body.shoulder_center=mid(11,12);
 const ang=(a,b)=>{if(!(ok(a)&&ok(b)))return null;let v=[p.w[b][0]-p.w[a][0],p.w[b][1]-p.w[a][1],p.w[b][2]-p.w[a][2]];if(v[0]<0)v=v.map(x=>-x);return [deg(Math.atan2(v[2],v[0])),deg(Math.atan2(v[1],v[0]))]};
 const sa=ang(11,12),ha=ang(23,24),av=(a,b)=>a!==null&&b!==null?(a+b)/2:a!==null?a:b;
 o.body.angles_deg={yaw:null,shoulder_roll:null,hip_roll:null,shoulder_yaw:null,hip_yaw:null};
 const A=o.body.angles_deg,y=av(sa&&sa[0],ha&&ha[0]);
 if(y!==null)A.yaw=f1(y);if(sa){A.shoulder_roll=f1(sa[1]);A.shoulder_yaw=f1(sa[0])}if(ha){A.hip_roll=f1(ha[1]);A.hip_yaw=f1(ha[0])}
 const fa=S.face&&S.face.ang;
 o.face.angles_deg={yaw:fa?f1(fa[0]):null,pitch:fa?f1(fa[1]):null,roll:fa?f1(fa[2]):null};
 if(m==='3d')o.face.head_center=mid(7,8);
 else for(const k in FACE_REF)o.face[k]=S.face&&S.face.v[k]?P2(S.face.n[k]):NA;
 for(const l of ['Left','Right']){const h=S.hands[l];
  HAND.forEach((nm,i)=>o.hands[l][nm]=h&&h.v[i]?(m==='2d'?P2(h.n[i]):P3(h.w[i])):NA)}
 return o}
function render(o){
 const L=[],fv=x=>x===null?'-':x;
 const line=v=>Array.isArray(v)?(v[0]===null?'('+v.map(()=>'-').join(',')+')':v.map(x=>String(x).padStart(8)).join('')):typeof v==='object'?Object.entries(v).map(([a,b])=>a+':'+fv(b)).join(' '):v;
 const sec=(t,obj)=>{L.push('<h4>'+t+'</h4>');for(const k in obj)L.push(k.padEnd(15)+line(obj[k]))};
 L.push('<b>'+o.mode.toUpperCase()+' ('+o.units+')</b>  未検出=(-,-,-)');
 sec('顔',o.face);sec('体 基準点',o.body);sec('全身 33点',o.pose);sec('左手 21点',o.hands.Left);sec('右手 21点',o.hands.Right);
 panel.innerHTML=L.join('\n')}

// ---- 描画 ----
function draw(){
 ctx.clearRect(0,0,W,H);
 const X=n=>(mirror?1-n[0]:n[0])*W,Y=n=>n[1]*H;
 if(S.faceRaw){ctx.fillStyle='rgba(120,200,255,.45)';for(const p of S.faceRaw)ctx.fillRect((mirror?1-p.x:p.x)*W-1,p.y*H-1,2,2)}
 const skel=(n,v,cn,col)=>{ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();
  for(const c of cn){if(!v[c.start]||!v[c.end])continue;const a=n[c.start],b=n[c.end];ctx.moveTo(X(a),Y(a));ctx.lineTo(X(b),Y(b))}ctx.stroke();
  ctx.fillStyle=col;n.forEach((p,i)=>{if(!v[i])return;ctx.beginPath();ctx.arc(X(p),Y(p),3,0,6.3);ctx.fill()})};
 if(S.pose&&M)skel(S.pose.n,S.pose.v,M.PoseLandmarker.POSE_CONNECTIONS,'#3ddc97');
 if(M){if(S.hands.Left)skel(S.hands.Left.n,S.hands.Left.v,M.HandLandmarker.HAND_CONNECTIONS,'#ffc247');
  if(S.hands.Right)skel(S.hands.Right.n,S.hands.Right.v,M.HandLandmarker.HAND_CONNECTIONS,'#ff7ad9')}}

function loop(now){
 raf=requestAnimationFrame(loop);
 if(!stream||video.readyState<2||video.currentTime===lastT||now-lastRun<1000/fps-2)return;
 lastRun=now;lastT=video.currentTime;
 detect(now);draw();
 if(now-cntT>=1000){chip('fps',cnt+'/s','ok');cnt=0;cntT=now}
 if(showPanel&&now-lastPanel>120){lastPanel=now;render(build())}}

// ---- リサイズ ----
function resize(){const r=stage.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
new ResizeObserver(resize).observe(stage);addEventListener('resize',resize);

// ---- UI（ライブラリ読込前から有効） ----
$('bCam').onclick=()=>stream?camOff():camOn();
$('bFace').onclick=()=>{facing=facing==='user'?'environment':'user';$('bFace').textContent='前面/背面: '+(facing==='user'?'前面':'背面');restart()};
$('bMode').onclick=()=>{mode=mode==='2d'?'3d':'2d';$('bMode').textContent='モード: '+mode.toUpperCase();render(build())};
$('bPanel').onclick=()=>{showPanel=!showPanel;panel.style.display=showPanel?'block':'none';$('bPanel').classList.toggle('on',showPanel)};
$('bCopy').onclick=async()=>{const t=JSON.stringify(build(),null,1);
 try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){showErr('コピー失敗',e.message)}a.remove()}
 $('bCopy').textContent='コピーしました';setTimeout(()=>$('bCopy').textContent='JSONコピー',1200)};
$('sRes').onchange=e=>{camW=+e.target.value;restart()};
$('sFps').onchange=e=>fps=+e.target.value;
$('sSm').onchange=e=>mc=+e.target.value;
for(const k of ['Face','Pose','Hand'])$('c'+k).onchange=e=>{opt[k.toLowerCase()]=e.target.checked;S=empty()};

render(build());
loadAll();
</script></body></html>
